[project]
name = "compound-interest-calculator"
version = "0.1.0"
description = "複利計算のシミュレーション結果を算出するCLIツール兼ライブラリ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
compound-interest-calculator = "compound_interest_calculator:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["compound_interest_calculator.py"]
